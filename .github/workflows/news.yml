# Gathers headlines for the app's News tab every hour and publishes news/news.json on this site.
name: Gather news
on:
  schedule:
    - cron: "17 * * * *"   # every hour at :17 (off the hour, when GitHub is less busy)
  workflow_dispatch:        # lets you run it by hand from the Actions tab
permissions:
  contents: write
concurrency:
  group: news
  cancel-in-progress: false
jobs:
  gather:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node news/build.mjs
      - name: Publish if the list changed
        run: |
          if git diff --quiet -- news/news.json && git ls-files --error-unmatch news/news.json >/dev/null 2>&1; then
            echo "Nothing new."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news/news.json
          git commit -m "News update"
          git push
